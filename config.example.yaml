# Copy this file to config.yaml and edit it. Secrets (keys, passwords) go in .env, never here.

# paper = real market prices, simulated orders (no money at risk). Start here.
# live  = real orders. Also requires running with the --live flag.
mode: paper

# mt5 | hyperliquid
broker: mt5

mt5:
  # Broker symbol names differ: XAUUSD, XAUUSD.m, XAUUSDm, GOLD ... check Market Watch.
  symbol: XAUUSD
  # Tag so the bot only touches its own positions.
  magic: 240925
  deviation_points: 30
  # MT5 candle times are in broker server time. null = auto-detect from the live tick.
  server_utc_offset_hours: null

hyperliquid:
  # PAXG is a gold-backed token (1 PAXG = 1 troy ounce). Builder-deployed (HIP-3) gold
  # markets use the "dex:NAME" form, e.g. "xyz:GOLD" - check the Hyperliquid app for the exact name.
  coin: PAXG
  testnet: true
  leverage: 5
  cross_margin: true
  slippage: 0.003

strategy:
  # asian_breakout | ny_orb | asian_sweep | trend_pullback | ifvg_hammer   (compare: python -m xau_agent compare ...)
  name: ifvg_hammer
  # Signal candles: 1m or 5m for scalping, 15m for the original Asian breakout.
  timeframe: 5m
  # rr         = stop just beyond the setup's own level (hammer low / shooting-star high, sweep wick,
  #              swing...) + stop_buffer_pips; target = reward_risk x that stop distance.
  # fixed_pips = SL/TP always sl_pips / tp_pips from entry.
  exit_mode: rr
  reward_risk: 2.0          # 2.0 = RR 1:2
  stop_buffer_pips: 3       # extra room beyond the wick for spread / stop hunts
  min_stop_pips: 10         # never a tighter stop than this
  max_stop_pips: 100        # skip the signal if the stop would be wider (0.1 lot: 100 pips = $100)
  min_stop_atr: 0.0         # optional extra minimum in daily ATRs (0 = off)
  # fixed_pips mode only:
  sl_pips: 25
  tp_pips: 50
  # 1 pip in price. XAUUSD on most MT5 brokers: 0.10 (so 25 pips = $2.50 move). Check your broker.
  pip_size: 0.10
  atr_period: 14
  # Close any open position at this time (all times UTC unless the name says _ny).
  flatten_utc: "20:30"
  weekdays_only: true

# --- per-strategy settings -----------------------------------------------------------------------
asian_breakout:
  # First candle that closes beyond the Asian session high/low.
  asian_start_utc: "00:00"
  asian_end_utc: "07:00"
  entry_end_utc: "16:00"
  max_range_atr: 1.2       # skip if the Asian range is wider than this many daily ATRs
  min_range_atr: 0.15      # ...or narrower than this
  breakout_buffer_atr: 0.02
  stop_mode: mid           # atr exit mode: stop at range middle (mid) or other side (opposite)

ny_orb:
  # New York opening range breakout. Times are New York time (daylight saving handled automatically).
  start_ny: "09:30"
  # Gold's first 30 minutes in New York are usually far wider than a 25-pip stop, so start with 15.
  minutes: 15
  entry_end_ny: "12:00"
  # Skip the day if the opening range is wider than this (pips) - a news spike / whipsaw day.
  max_range_pips: 80

asian_sweep:
  # London takes out the Asian high (low), then a candle closes back inside -> short (long).
  asian_start_utc: "00:00"
  asian_end_utc: "07:00"
  end_utc: "10:00"
  max_range_atr: 1.2
  min_range_atr: 0.15

trend_pullback:
  # H1 EMA trend_fast vs trend_slow sets the direction; entry when a candle dips to the EMA and
  # closes back in the trend direction. The swing over swing_bars candles must fit inside the SL.
  sessions_utc: "07:00-11:00,13:00-17:00"
  ema: 20
  trend_fast: 50
  trend_slow: 200
  swing_bars: 6
  cooldown_bars: 6

ifvg_hammer:
  # Hammer (long lower wick at a swing low), then within a few candles a candle CLOSES above a
  # bearish fair value gap (the gap is "inverted" = IFVG) -> long at that close. Shorts: the mirror
  # (shooting star, then a close below a bullish FVG).
  sessions_utc: "07:00-11:00,13:00-17:00"
  # FVG = gap between candle 1 and candle 3 of a strong move. Ignore gaps older / smaller than this.
  fvg_lookback_bars: 30
  min_fvg_pips: 3
  # The IFVG must close on the hammer candle itself or within this many candles after it.
  hammer_max_bars_before: 6
  # Hammer shape: long wick >= wick_ratio x body, other wick <= max_opposite_wick x candle range.
  hammer_wick_ratio: 2.0
  hammer_max_opposite_wick: 0.25
  hammer_min_range_pips: 5
  # Hammer low must be the lowest low of the last N candles (0 = off).
  hammer_swing_bars: 10
  # fixed_pips mode only: skip if the hammer's low is further than sl_pips from entry
  # (the stop would sit inside the wick). In rr mode the stop always goes beyond the hammer.
  require_stop_beyond_hammer: true

risk:
  # fixed_lots = every entry uses fixed_lots. percent = size from risk_per_trade_pct.
  sizing: fixed_lots
  fixed_lots: 0.1
  # Ounces per lot (standard XAUUSD = 100). 0.1 lot = 10 oz = $1 per pip with pip_size 0.10.
  contract_oz: 100
  # fixed_lots: skip the trade if one stop-out would lose more than this % of equity.
  max_risk_per_trade_pct: 2.0
  risk_per_trade_pct: 0.5   # percent sizing only
  # Stop opening trades for the rest of the UTC day after losing this % of the day's starting equity.
  max_daily_loss_pct: 2.0
  max_open_positions: 1
  max_trades_per_day: 2
  # Skip entry if the spread is wider than this many pips (or this many basis points).
  max_spread_pips: 5
  max_spread_bps: 8
  # Skip entry if position value would exceed equity x this. 0.1 lot of gold is about 10 oz x price.
  max_leverage: 50
  # No new entries this many minutes before/after high-impact USD news.
  news_blackout_before_min: 15
  news_blackout_after_min: 15
  block_if_calendar_unavailable: true

agent:
  # true = Claude reviews every signal and can veto it. false = trade every valid signal.
  enabled: true
  model: claude-opus-5-5
  # low | medium | high | xhigh | max
  effort: medium
  min_confidence: 0.6
  # Web news search before each decision. Slower (can take ~30-60s): on 1m/5m you may prefer false.
  news_search: true

paper:
  starting_equity: 10000
  # Simulated commission per side in basis points of position value. The spread is already paid
  # through bid/ask fills. Standard MT5 accounts: 0. Hyperliquid taker: about 4.5.
  fee_bps: 0.0

poll_seconds: 10
data_dir: data
